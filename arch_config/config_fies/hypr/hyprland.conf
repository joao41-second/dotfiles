###################
####### Plugins ###
###################

# Carregado diretamente aqui. Se preferires usar o hyprpm, remove esta linha
# e descomenta o "hyprpm reload -n" no AUTOSTART (nunca os dois ao mesmo tempo).
plugin = /usr/lib/libhy3.so

###################
####### Monitor ###
###################

monitor = HDMI-A-1, 1920x1080@60, 0x0, 1
# monitor do portátil
monitor = eDP-1, 1920x1080@60, 1920x0, 1
# monitor externo (à esquerda)
monitor = DP-1, 1280x1024@60, -1280x0, 1

###################
### VARIABLES ###
###################

$mainMod = SUPER
$terminal = kitty
# CORRIGIDO: tinha "exec" duplicado (o bind já faz "exec, $fileManager")
# CORRIGIDO: o kitty usa --class (no Wayland define o app_id); --app-id não existe
$fileManager = kitty --class yazi-float -e yazi
$menu = hyprlauncher

###################
### ENVIRONMENT ###
###################

env = XCURSOR_SIZE,24
# REMOVIDO: KITTY_CONFIG_DIRECTORY com $USER (o Hyprland não expande $USER,
# e ~/.config/kitty já é o caminho por defeito do kitty)
env = __NV_PRIME_RENDER_OFFLOAD,1
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = GBM_BACKEND,nvidia-drm
env = __GL_GSYNC_ALLOWED,0
env = __GL_VRR_ALLOWED,0
env = GTK_USE_PORTAL,1
env = QT_QPA_PLATFORMTHEME,xdgdesktopportal

###################
### AUTOSTART ###
###################


exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland XDG_SESSION_TYPE=wayland HYPRLAND_INSTANCE_SIGNATURE GTK_USE_PORTAL
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE GTK_USE_PORTAL
exec-once = nm-applet & blueman-applet
exec-once = waybar & hyprpaper
exec-onec = systemctl start tailscaled


###################
### GENERAL ###
###################

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    col.active_border = rgba(33ccffee)
    col.inactive_border = rgba(595959aa)

    layout = hy3
}

###################
### DECORATION ###
###################

decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 0.9
    inactive_opacity = 0.9

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.5
        xray = true
    }
}

###################
### ANIMATIONS ###
###################

animations {
    enabled = true

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,     1, 10, default
    animation = border,     1, 5,  easeOutQuint
    animation = windows,    1, 4,  easeOutQuint
    animation = windowsIn,  1, 4,  easeOutQuint, popin 87%
    animation = windowsOut, 1, 2,  linear, popin 87%
    animation = fadeIn,     1, 2,  almostLinear
    animation = fadeOut,    1, 2,  almostLinear
    animation = workspaces, 1, 2,  almostLinear, fade
}

###################
### LAYOUTS ###
###################

dwindle {
    # pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

###################
### INPUT ###
###################

input {
    kb_layout = us
    kb_variant = intl
    follow_mouse = 1
    sensitivity = 0
    kb_options = caps:super
    numlock_by_default = true

    touchpad {
        natural_scroll = false
    }
}

###################
### GESTURES ###
###################

gesture = 3, horizontal, workspace

###################
### KEYBINDS ###
###################

bind = ALT, TAB, cyclenext
bind = ALT SHIFT, TAB, cyclenext, prev

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, M, exec, $menu

# CORRIGIDO: "SHIFT, Q" sozinho impedia-te de escrever Q maiúsculo em qualquer app
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, P, fullscreen
bind = $mainMod, P, fullscreen, 1
bind = $mainMod, Y, togglefloating, active

# Mover o foco (hy3) - setas e hjkl
bind = $mainMod, left,  hy3:movefocus, l
bind = $mainMod, right, hy3:movefocus, r
bind = $mainMod, up,    hy3:movefocus, u
bind = $mainMod, down,  hy3:movefocus, d

bind = $mainMod, H, hy3:movefocus, l
bind = $mainMod, L, hy3:movefocus, r
bind = $mainMod, K, hy3:movefocus, u
bind = $mainMod, J, hy3:movefocus, d

# Mover janela (hy3)
# CORRIGIDO: havia binds duplicados (movewindow + hy3:movewindow) nas mesmas teclas
bind = $mainMod SHIFT, H, hy3:movewindow, l
bind = $mainMod SHIFT, L, hy3:movewindow, r
bind = $mainMod SHIFT, K, hy3:movewindow, u
bind = $mainMod SHIFT, J, hy3:movewindow, d

# split horizontal / vertical
bind = $mainMod, V, hy3:makegroup, h
bind = $mainMod, B, hy3:makegroup, v

# modo tabbed
bind = $mainMod, T, hy3:changegroup, tab

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Mover janela para workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Screenshots
bind = , PRINT, exec, grim ~/Pictures/screenshot-$(date +%s).png
bind = SHIFT, PRINT, exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%s).png

###################
### MOUSE ###
###################

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

###################
### MEDIA KEYS ###
###################

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    # Ignorar pedidos de maximizar
    name = suppress-maximize-events
    match:class = .*

    # CORRIGIDO: estava "maxiize"
    suppress_event = maximize
}

windowrule {
    # Corrige problemas de drag com XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

windowrule {
    name = yazi_float
    match:class = ^(yazi-float)$

    pin = true
    float = yes
    size = 1200 850
    move = 10% 10%
    opacity = 1 1
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

cursor {
    no_hardware_cursors = true
}
